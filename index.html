<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>青龙面板入口</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:#0d1117;color:#e6edf3;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.box{width:min(92vw,420px);padding:28px 26px;background:#161b22;border:1px solid #30363d;border-radius:12px;text-align:center}
h1{margin:0 0 6px;font-size:18px;font-weight:600}
.sub{color:#8b949e;font-size:13px;margin-bottom:18px}
a.btn{display:block;padding:12px;border-radius:8px;background:#238636;color:#fff;text-decoration:none;font-weight:600;word-break:break-all}
a.btn:hover{background:#2ea043}
.tip{margin-top:14px;font-size:12px;color:#8b949e}
#msg{color:#8b949e;font-size:13px}
</style>
</head>
<body>
<div class="box">
  <h1>青龙面板</h1>
  <div class="sub">正在读取最新地址…</div>
  <div id="msg">请稍候</div>
  <a class="btn" id="go" href="#" style="display:none">打开面板</a>
  <div class="tip">该地址由服务器上的定时任务自动同步，隧道变更后会在 1 分钟内更新</div>
</div>
<script>
(async()=>{
  const msg=document.getElementById('msg'), btn=document.getElementById('go');
  const stamp='<br><span style="font-size:12px;color:#8b949e">更新时间：'+new Date().toLocaleString('zh-CN')+'</span>';
  try{
    const r=await fetch('url.txt?_='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const url=(await r.text()).trim().split(/\s+/)[0];
    if(!/^https?:\/\//.test(url)) throw new Error('地址格式异常');
    document.querySelector('.sub').textContent='已找到地址，正在跳转…';
    msg.innerHTML='目标：'+url+stamp;
    btn.href=url; btn.style.display='block';
    setTimeout(()=>location.replace(url),800);
  }catch(e){
    document.querySelector('.sub').textContent='读取失败';
    msg.textContent='请手动刷新页面重试（'+e.message+'）';
  }
})();
</script>
</body>
</html>
