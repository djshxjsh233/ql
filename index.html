<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>青龙面板入口</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:#0d1117;color:#e6edf3;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.box{width:min(92vw,430px);padding:28px 26px;background:#161b22;border:1px solid #30363d;border-radius:12px;text-align:center}
h1{margin:0 0 6px;font-size:18px;font-weight:600}
.sub{color:#8b949e;font-size:13px;margin-bottom:16px}
a.btn{display:block;padding:12px;border-radius:8px;background:#238636;color:#fff;text-decoration:none;font-weight:600;word-break:break-all}
a.btn:hover{background:#2ea043}
.tip{margin-top:14px;font-size:12px;color:#8b949e}
#msg{color:#8b949e;font-size:13px;word-break:break-all}
</style>
</head>
<body>
<div class="box">
  <h1>青龙面板</h1>
  <div class="sub">正在读取最新地址…</div>
  <div id="msg">请稍候</div>
  <a class="btn" id="go" href="#" style="display:none">打开面板</a>
  <div class="tip">地址由服务器定时同步；读取失败时点按钮或刷新页面重试</div>
</div>
<script>
(async()=>{
  const msg=document.getElementById('msg'), btn=document.getElementById('go'), sub=document.querySelector('.sub');
  const REPO='djshxjsh233/ql', FILE='url.txt';

  async function fromApi(){
    const r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+FILE,
      {headers:{'Accept':'application/vnd.github.v3.raw'},cache:'no-store'});
    if(!r.ok) throw new Error('api '+r.status);
    return (await r.text()).trim().split(/\s+/)[0];
  }
  async function fromPage(){
    const r=await fetch(FILE+'?_='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('page '+r.status);
    return (await r.text()).trim().split(/\s+/)[0];
  }

  let url='', src='';
  try{ url=await fromApi(); src='实时接口'; }
  catch(e){ try{ url=await fromPage(); src='页面文件'; }catch(e2){ src=''; } }

  if(url && /^https:\/\//.test(url)){
    sub.textContent='已找到地址，正在跳转…';
    msg.innerHTML='目标：'+url+'<br><span style="font-size:12px;color:#8b949e">来源：'+src+'</span>';
    btn.href=url; btn.style.display='block';
    setTimeout(()=>location.replace(url),700);
  }else{
    sub.textContent='暂时读取不到地址';
    msg.textContent='服务器可能正在切换隧道，请 1 分钟后刷新本页';
  }
})();
</script>
</body>
</html>
